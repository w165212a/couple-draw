<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>♟️ 双人对弈 💕 五子棋</title>
  <link rel="stylesheet" href="/css/gomoku.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
</head>
<body>
  <!-- 背景光影 -->
  <div class="bg-canvas-layer"></div>
  <div class="bg-overlay-layer"></div>

  <div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="header">
      <div class="header-left">
        <a href="/" class="nav-pill-btn" id="homeNavBtn" title="返回专属大厅">
          <span>🏠 首页</span>
        </a>
        <div class="nav-pill-btn" id="roomBtn" title="点击复制房间链接">
          <span>🗝️</span>
          <span id="roomDisplay">sweet520</span>
        </div>
      </div>

      <div class="header-right">
        <button class="nav-pill-btn primary" id="skinToggleBtn" title="切换棋子皮肤">
          <span>🎨 皮肤</span>
        </button>
        <button class="nav-pill-btn" id="soundToggleBtn" title="音效开关">
          <span>🔊 音效</span>
        </button>
      </div>
    </header>

    <!-- 双方对弈状态与计分板 -->
    <section class="scoreboard-card">
      <!-- 执黑方 (先手) -->
      <div class="player-side left">
        <div class="avatar-wrapper">
          <div class="player-avatar" id="blackPlayerAvatar">🐶</div>
          <div class="stone-indicator-badge badge-black">⚫</div>
        </div>
        <div class="player-meta">
          <div class="player-name" id="blackPlayerName">等待加入...</div>
          <div class="player-score-pill" id="blackPlayerScore">胜局: 0</div>
          <span class="ready-tag not-ready" id="blackReadyTag">未准备</span>
        </div>
      </div>

      <!-- 中间回合状态与总比分 -->
      <div class="match-status-center">
        <div class="turn-pill" id="turnIndicatorPill">
          <span id="turnText">等待双方准备</span>
        </div>
        <div class="vs-score-text" id="vsScoreText">0 : 0</div>
      </div>

      <!-- 执白方 (后手) -->
      <div class="player-side right">
        <div class="avatar-wrapper">
          <div class="player-avatar" id="whitePlayerAvatar">🐱</div>
          <div class="stone-indicator-badge badge-white">⚪</div>
        </div>
        <div class="player-meta">
          <div class="player-name" id="whitePlayerName">等待加入...</div>
          <div class="player-score-pill" id="whitePlayerScore">胜局: 0</div>
          <span class="ready-tag not-ready" id="whiteReadyTag">空缺</span>
        </div>
      </div>
    </section>

    <!-- 棋盘区域 -->
    <div class="board-container" id="boardContainer">
      <canvas id="gomokuCanvas"></canvas>
    </div>

    <!-- 底部操作按钮 -->
    <div class="action-bar">
      <button class="action-btn action-btn-primary" id="readyBtn">
        <span>❤️ 准备对局</span>
      </button>
      <button class="action-btn action-btn-secondary" id="undoBtn" disabled>
        <span>↩️ 悔棋</span>
      </button>
      <button class="action-btn action-btn-secondary" id="surrenderBtn" disabled>
        <span>🏳️ 认输</span>
      </button>
    </div>
  </div>

  <!-- 1. 皮肤选择弹窗 -->
  <div class="modal-overlay" id="skinModal">
    <div class="modal-dialog">
      <div class="modal-title">🎨 挑选棋子专属皮肤</div>
      <div class="modal-desc">为你们的对弈换上专属可爱风格：</div>
      <div class="skin-grid">
        <div class="skin-card active" data-skin="classic">
          <div class="skin-preview-icons">⚫⚪</div>
          <div class="skin-name">经典玉石</div>
        </div>
        <div class="skin-card" data-skin="pets">
          <div class="skin-preview-icons">🐾🐶</div>
          <div class="skin-name">萌宠印记</div>
        </div>
        <div class="skin-card" data-skin="gems">
          <div class="skin-preview-icons">🔮💎</div>
          <div class="skin-name">璀璨珠宝</div>
        </div>
      </div>
      <button class="modal-btn primary" id="closeSkinModalBtn" style="width:100%;">确定使用</button>
    </div>
  </div>

  <!-- 2. 悔棋提示弹窗 -->
  <div class="modal-overlay" id="undoPromptModal">
    <div class="modal-dialog">
      <div class="modal-title">🕊️ 悔棋申请</div>
      <div class="modal-desc" id="undoPromptDesc">对方申请悔棋一步，是否同意？</div>
      <div class="modal-btn-row">
        <button class="modal-btn cancel" id="rejectUndoBtn">认真点，不给悔！😜</button>
        <button class="modal-btn primary" id="acceptUndoBtn">原谅你，同意悔棋 💕</button>
      </div>
    </div>
  </div>

  <!-- 3. 胜利结算与趣味惩罚大转盘弹窗 -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-dialog">
      <div class="modal-title" id="gameOverTitle">🎉 达成绝杀！</div>
      <div class="modal-desc" id="gameOverDesc">五连珠！恭喜赢下本局！</div>

      <!-- 惩罚大转盘 -->
      <div class="wheel-wrapper">
        <canvas id="wheelCanvas"></canvas>
        <div class="wheel-pointer" id="wheelPointer" title="点击转动转盘">🎯</div>
      </div>

      <div class="punishment-result-banner" id="punishmentResultBanner">
        点击转盘中央指针，抽取专属惩罚彩蛋 🎯
      </div>

      <div class="modal-btn-row">
        <button class="modal-btn cancel" id="spinWheelBtn">转动转盘 🎲</button>
        <button class="modal-btn primary" id="nextRoundBtn">再来一局 (交换先手) 🔄</button>
      </div>
    </div>
  </div>

  <!-- 4. 首次进入玩家昵称与头像弹窗 -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-dialog">
      <div class="modal-title">✨ 挑选你的对弈形象</div>
      <div class="modal-desc">输入昵称并选择一个软萌头像，开始对弈吧~</div>
      <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-bottom:12px;" id="avatarGrid">
        <button class="avatar-btn active" data-avatar="🐱" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🐱</button>
        <button class="avatar-btn" data-avatar="🐶" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🐶</button>
        <button class="avatar-btn" data-avatar="🐰" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🐰</button>
        <button class="avatar-btn" data-avatar="🐻" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🐻</button>
        <button class="avatar-btn" data-avatar="🐼" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🐼</button>
        <button class="avatar-btn" data-avatar="🦊" style="font-size:22px; padding:6px; border-radius:10px; border:1px solid #E5E7EB; background:#FFF; cursor:pointer;">🦊</button>
      </div>
      <input type="text" class="modal-input" id="nameInput" placeholder="输入你的专属昵称" maxlength="12" style="width:100%; padding:10px 14px; border:1.5px solid #E5E7EB; border-radius:12px; margin-bottom:14px; outline:none;">
      <button class="modal-btn primary" id="confirmNameBtn" style="width:100%;">进入棋局</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/gomoku.js"></script>
</body>
</html>
