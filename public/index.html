<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌸 我们的专属小世界</title>
  <link rel="stylesheet" href="/css/home.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
</head>
<body>
  <!-- 全屏水彩插画背景与轻柔漫反射光影 -->
  <div class="bg-canvas-layer"></div>
  <div class="bg-overlay-layer"></div>

  <div class="home-container">
    <!-- 顶部导航与画册直达 -->
    <header class="top-nav">
      <div class="brand-badge">
        <span class="brand-heart">💕</span>
        <span class="brand-title">专属小世界</span>
      </div>

      <div class="nav-actions">
        <!-- 画册快捷直达 -->
        <button class="nav-pill-btn" id="openLobbyGalleryBtn" title="查看我们的画作回忆">
          <span>📖</span>
          <span>画册</span>
        </button>
      </div>
    </header>

    <!-- 核心功能卡片 -->
    <main class="main-content">
      <div class="cards-grid">
        <!-- 核心功能 1：你画我猜 (已就绪·立即畅玩) -->
        <div class="feature-card card-featured">
          <div class="card-top">
            <div class="card-icon-box">🎨</div>
            <div class="card-tag tag-ready">
              <span>⚡</span>
              <span>立即畅玩</span>
            </div>
          </div>
          <div class="card-content">
            <h3>你画我猜 · 默契大作画</h3>
            <p>实时双人画板连线 · 1000道精选题库 · 双人暂停自由涂鸦 · 永久拍立得画册</p>
          </div>
          <div class="card-action-row">
            <button class="primary-enter-btn" id="quickEnterBtn">
              <span>进入房间</span>
              <span>➜</span>
            </button>
            <button class="custom-room-btn" id="customRoomBtn">
              自定义房间
            </button>
          </div>
        </div>

        <!-- 核心功能 2：五子棋 (已就绪·立即畅玩) -->
        <div class="feature-card card-featured">
          <div class="card-top">
            <div class="card-icon-box">♟️</div>
            <div class="card-tag tag-ready">
              <span>⚡</span>
              <span>立即畅玩</span>
            </div>
          </div>
          <div class="card-content">
            <h3>五子棋 · 智力对弈</h3>
            <p>双人实时在线对战 · 3套萌宠与珠宝皮肤 · 悔棋求和 · 趣味惩罚大转盘</p>
          </div>
          <div class="card-action-row">
            <button class="primary-enter-btn" id="quickGomokuBtn">
              <span>进入房间</span>
              <span>➜</span>
            </button>
            <button class="custom-room-btn" id="customGomokuBtn">
              自定义房间
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- 底部暖心寄语 -->
    <footer class="footer-bar">
      <div class="quote-bubble">
        <span>🐾</span>
        <span id="quoteText">每一次下笔，都是属于我们两人的心有灵犀 💕</span>
      </div>
    </footer>
  </div>

  <!-- 1. 自定义房间号弹窗 -->
  <div class="modal-overlay" id="roomModal">
    <div class="modal-dialog">
      <div class="modal-icon">🗝️</div>
      <div class="modal-title">自定义游戏房间</div>
      <div class="modal-desc">输入属于你们二人的专属房间号（双方输入相同房间号即可连线）：</div>
      <input type="text" class="modal-input" id="roomInput" placeholder="例如: tingting520" maxlength="20">
      <div class="modal-btn-row">
        <button class="modal-btn modal-btn-cancel" id="cancelRoomBtn">取消</button>
        <button class="modal-btn modal-btn-primary" id="enterRoomConfirmBtn">立即连线进入</button>
      </div>
    </div>
  </div>

  <!-- 2. 筹备中功能温馨提示弹窗 -->
  <div class="modal-overlay" id="upcomingModal">
    <div class="modal-dialog">
      <div class="modal-icon">♟️</div>
      <div class="modal-title" id="upcomingModalTitle">功能筹备中</div>
      <div class="modal-desc" id="upcomingModalDesc">五子棋小游戏正在紧锣密鼓设计中，马上就会上线！</div>
      <button class="modal-btn modal-btn-primary" id="closeUpcomingBtn">好的，等你们上线 💕</button>
    </div>
  </div>

  <!-- 3. 大厅画册预览弹窗 -->
  <div class="modal-overlay" id="lobbyGalleryModal">
    <div class="modal-dialog gallery-dialog">
      <div class="modal-title">📖 我们的画册</div>
      <div class="modal-desc">这里永久珍藏着你们在「你画我猜」中默契通关的每一幅画作：</div>
      <div id="emptyGalleryTip" style="display:none; color:#9CA3AF; padding:20px 0; font-size:13px;">
        还没有保存的画作哦，快去游戏中画一幅吧~ 🎨
      </div>
      <div class="gallery-grid" id="lobbyGalleryGrid"></div>
      <div style="margin-top:14px;">
        <button class="modal-btn modal-btn-cancel" id="closeLobbyGalleryBtn" style="width:100%;">返回大厅</button>
      </div>
    </div>
  </div>

  <script src="/js/home.js"></script>
</body>
</html>
